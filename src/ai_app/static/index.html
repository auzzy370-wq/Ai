<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WitBot</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0c0c14;
        --panel: #13131f;
        --border: #252538;
        --text: #eaeaf5;
        --muted: #8888aa;
        --accent: #a855f7;
        --accent-dim: #7c3aed;
        --accent-glow: rgba(168, 85, 247, 0.18);
        --user: #1e1b2e;
        --assistant: #0f0f1a;
        --mock: #f59e0b;
        --live: #22c55e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(ellipse at 30% 0%, #1a0d2e 0%, var(--bg) 55%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(740px, 100%);
        height: min(82vh, 780px);
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        border: 1px solid var(--border);
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.08), 0 28px 80px rgba(0, 0, 0, 0.5);
      }

      header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        background: linear-gradient(180deg, rgba(168, 85, 247, 0.06) 0%, transparent 100%);
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-dim));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        flex-shrink: 0;
        box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
      }

      .header-text h1 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        background: linear-gradient(90deg, #d8b4fe, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .header-text p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .status-pill {
        font-size: 0.72rem;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        white-space: nowrap;
        flex-shrink: 0;
        cursor: default;
        transition: opacity 0.2s;
      }

      .status-pill.mock {
        color: var(--mock);
        border-color: rgba(245, 158, 11, 0.2);
      }

      .status-pill.openai {
        color: var(--live);
        border-color: rgba(34, 197, 94, 0.2);
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 10px 20px 0;
      }

      .toolbar button {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        border-radius: 10px;
        padding: 5px 11px;
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        transition: color 0.15s, border-color 0.15s;
      }

      .toolbar button:hover {
        color: var(--text);
        border-color: rgba(168, 85, 247, 0.4);
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      .welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
        gap: 10px;
        padding: 20px;
        opacity: 0.85;
      }

      .welcome .big-logo {
        font-size: 2.8rem;
        margin-bottom: 4px;
        filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.5));
      }

      .welcome h2 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(90deg, #d8b4fe, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .welcome p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        max-width: 340px;
        line-height: 1.5;
      }

      .starter-prompts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 10px;
      }

      .starter-chip {
        border: 1px solid var(--border);
        background: rgba(168, 85, 247, 0.06);
        color: var(--muted);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
        font: inherit;
        font-size: 0.82rem;
        transition: color 0.15s, border-color 0.15s, background 0.15s;
      }

      .starter-chip:hover {
        color: #d8b4fe;
        border-color: rgba(168, 85, 247, 0.5);
        background: rgba(168, 85, 247, 0.1);
      }

      .message {
        max-width: 86%;
        padding: 11px 14px;
        border-radius: 16px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.95rem;
        animation: fadeUp 0.18s ease;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        align-self: flex-end;
        background: linear-gradient(135deg, #1e1b2e, #2a1f42);
        border: 1px solid rgba(168, 85, 247, 0.25);
      }

      .message.assistant {
        align-self: flex-start;
        background: var(--assistant);
        border: 1px solid var(--border);
      }

      .message.assistant.streaming::after {
        content: "▌";
        display: inline-block;
        margin-left: 2px;
        animation: blink 0.7s step-end infinite;
        color: var(--accent);
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .message .meta {
        display: block;
        margin-top: 7px;
        font-size: 0.7rem;
        color: var(--muted);
        opacity: 0.7;
      }

      form {
        display: flex;
        gap: 10px;
        padding: 14px 20px 18px;
        border-top: 1px solid var(--border);
      }

      input,
      button {
        font: inherit;
      }

      input {
        flex: 1;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        border-radius: 13px;
        padding: 11px 14px;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      input:focus {
        outline: none;
        border-color: rgba(168, 85, 247, 0.6);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      input::placeholder {
        color: var(--muted);
        opacity: 0.6;
      }

      button[type="submit"] {
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-dim));
        color: white;
        border-radius: 13px;
        padding: 0 20px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: opacity 0.15s, box-shadow 0.15s;
        box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
      }

      button[type="submit"]:hover:not(:disabled) {
        box-shadow: 0 4px 18px rgba(168, 85, 247, 0.5);
        opacity: 0.92;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="header-brand">
          <div class="logo">🎭</div>
          <div class="header-text">
            <h1>WitBot</h1>
            <p>Your digital sparring partner</p>
          </div>
        </div>
        <span id="status-pill" class="status-pill mock" title="">loading...</span>
      </header>
      <div class="toolbar">
        <button type="button" id="export-button">Export JSON</button>
        <button type="button" id="clear-button">Clear chat</button>
      </div>
      <div id="messages" aria-live="polite"></div>
      <form id="chat-form">
        <input
          id="message-input"
          type="text"
          placeholder="Say something. Anything. I'll have a comeback ready."
          autocomplete="off"
          required
        />
        <button type="submit" id="send-button">Send</button>
      </form>
    </main>
    <script>
      const STORAGE_KEY = "witbot-chat-history";
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("message-input");
      const sendButton = document.getElementById("send-button");
      const clearButton = document.getElementById("clear-button");
      const exportButton = document.getElementById("export-button");
      const statusPill = document.getElementById("status-pill");

      const STARTERS = [
        "Tell me a joke",
        "How are you doing?",
        "Roast me (gently)",
        "What's the meaning of life?",
        "Surprise me",
      ];

      let history = [];

      function saveHistory() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      }

      function loadHistory() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      }

      function renderWelcome() {
        messagesEl.innerHTML = "";
        const welcome = document.createElement("div");
        welcome.className = "welcome";
        welcome.innerHTML = `
          <div class="big-logo">🎭</div>
          <h2>Meet WitBot</h2>
          <p>The AI that responds to your texts with razor-sharp wit, clever comebacks, and the occasional pun. You've been warned.</p>
          <div class="starter-prompts">
            ${STARTERS.map((s) => `<button class="starter-chip">${s}</button>`).join("")}
          </div>
        `;
        welcome.querySelectorAll(".starter-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            input.value = chip.textContent;
            input.focus();
            form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
          });
        });
        messagesEl.appendChild(welcome);
      }

      function renderHistory() {
        messagesEl.innerHTML = "";
        if (history.length === 0) {
          renderWelcome();
          return;
        }
        for (const item of history) {
          addMessage(item.role, item.content, item.meta || "");
        }
      }

      function addMessage(role, text, meta = "") {
        const el = document.createElement("div");
        el.className = `message ${role}`;
        el.textContent = text;
        if (meta) {
          const metaEl = document.createElement("span");
          metaEl.className = "meta";
          metaEl.textContent = meta;
          el.appendChild(metaEl);
        }
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      async function loadStatus() {
        try {
          const response = await fetch("/api/status");
          const data = await response.json();
          const forced = data.mock_forced ? " (forced)" : "";
          statusPill.textContent = `${data.mode}${forced} · ${data.model}`;
          statusPill.className = `status-pill ${data.mode}`;
          statusPill.title = data.reason || "";
        } catch {
          statusPill.textContent = "offline";
          statusPill.className = "status-pill mock";
        }
      }

      exportButton.addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(history, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `witbot-chat-${new Date().toISOString().slice(0, 19)}.json`;
        link.click();
        URL.revokeObjectURL(url);
      });

      clearButton.addEventListener("click", () => {
        history = [];
        saveHistory();
        renderHistory();
        input.focus();
      });

      function createStreamingMessage() {
        const el = document.createElement("div");
        el.className = "message assistant streaming";
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      async function streamChat(message, requestHistory) {
        const response = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history: requestHistory }),
        });

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const assistantEl = createStreamingMessage();
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let fullText = "";
        let model = "witbot-mock";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";

          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data: ")) continue;

            const data = JSON.parse(line.slice(6));
            if (data.token) {
              fullText += data.token;
              assistantEl.textContent = fullText;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            if (data.done) {
              model = data.model;
            }
          }
        }

        assistantEl.classList.remove("streaming");
        return { reply: fullText.trim(), model, el: assistantEl };
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        const requestHistory = history.map(({ role, content }) => ({ role, content }));
        history.push({ role: "user", content: message });
        saveHistory();

        if (messagesEl.querySelector(".welcome")) {
          messagesEl.innerHTML = "";
        }
        addMessage("user", message);
        input.value = "";
        sendButton.disabled = true;

        try {
          const data = await streamChat(message, requestHistory);
          const metaEl = document.createElement("span");
          metaEl.className = "meta";
          metaEl.textContent = `model: ${data.model}`;
          data.el.appendChild(metaEl);

          history.push({
            role: "assistant",
            content: data.reply,
            meta: `model: ${data.model}`,
          });
          saveHistory();
        } catch (error) {
          const errEl = addMessage("assistant", `Something went wrong: ${error.message}`);
          history.push({ role: "assistant", content: `Error: ${error.message}` });
          saveHistory();
        } finally {
          sendButton.disabled = false;
          input.focus();
        }
      });

      history = loadHistory();
      renderHistory();
      loadStatus();
    </script>
  </body>
</html>
